name: Publish @pressit/image-compare

# Triggered by `pnpm image-compare:release`, which bumps the version, commits and pushes the tag.
on:
  push:
    tags:
      - 'image-compare-v*'

permissions:
  contents: read
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/image-compare
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "image-compare-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile --filter @pressit/image-compare

      - run: pnpm typecheck

      # pnpm pack builds dist (prepublishOnly is skipped by pack) and applies publishConfig.exports;
      # npm publishes the tarball because npm >= 11.5.1 does trusted publishing (OIDC, no token).
      - run: pnpm build && pnpm pack --out package.tgz
      - run: npm install -g npm@^11.5.1
      - run: npm publish package.tgz --access public
